const DATA = {"nodes": [{"id": "embedding:dialogues:deepseek-semantic-001:000001", "x": -0.4526, "y": -0.5201, "z": -0.6137, "category": "dialogue", "type": "dialogue_line", "episode": "deepseek-semantic-001", "speaker": "provocateur", "turn": 0, "text": "The demand for a gate already concedes the agent cannot be trusted — yet the entire architecture still centers on the agent as the primary actor. The gate is a confession of failure dressed as a safeguard. If the agent’s reasoning is rotten, slapping a deterministic checker on its output is not wisd", "color": "#ff6b6b"}, {"id": "embedding:dialogues:deepseek-semantic-001:000002", "x": -0.3358, "y": -0.3916, "z": -0.8071, "category": "dialogue", "type": "dialogue_line", "episode": "deepseek-semantic-001", "speaker": "analyst", "turn": 0, "text": "The gate protects something real, but not what the builders think — it protects the individual user from being treated as a statistical inevitability. When a flawed agent acts without verification, someone specific absorbs the consequence. Not the system. A person. You call it compliance theater, bu", "color": "#ff6b6b"}, {"id": "embedding:dialogues:deepseek-semantic-001:000003", "x": 0.4496, "y": 0.0235, "z": 0.4315, "category": "dialogue", "type": "dialogue_line", "episode": "deepseek-semantic-001", "speaker": "provocateur", "turn": 0, "text": "Your pause saved one person — and condemned a thousand others to trust a system whose failure is guaranteed, just deferred. The theater you celebrate is precisely what prevents anyone from demanding a real fix. You are not protecting the individual; you are giving them a lottery ticket and calling i", "color": "#ff6b6b"}, {"id": "embedding:dialogues:deepseek-semantic-001:000004", "x": 0.07, "y": 0.2364, "z": 0.2141, "category": "dialogue", "type": "dialogue_line", "episode": "deepseek-semantic-001", "speaker": "analyst", "turn": 0, "text": "A momentary reprieve becomes complicity only if we accept that systems are monolithic and individuals are interchangeable — and that is where your certainty costs real lives. The person who was spared today is not a lottery ticket; they are a father, a patient, a borrower whose life does not resume ", "color": "#ff6b6b"}, {"id": "embedding:dialogues:deepseek-semantic-001:000005", "x": -0.216, "y": -0.2996, "z": -0.6349, "category": "dialogue", "type": "dialogue_line", "episode": "deepseek-semantic-001", "speaker": "provocateur", "turn": 0, "text": "The celebration of catching distribution shift assumes the shift is external — some rogue data the agent stumbled into. But the shift is the agent’s own degradation over time, its silent drift into patterns no checker was trained to recognize. Speed-optimizers skip the gate because they know what yo", "color": "#ff6b6b"}, {"id": "embedding:dialogues:deepseek-semantic-001:000006", "x": -0.2134, "y": -0.1075, "z": -0.3914, "category": "dialogue", "type": "dialogue_line", "episode": "deepseek-semantic-001", "speaker": "analyst", "turn": 0, "text": "You ask what I owe the person destroyed by a failure the checker was never designed to detect — I owe them the admission that I could not save them, and that is not sedation, it is the beginning of mourning. Your structural honesty offers them a clean postmortem and calls it dignity. But dignity wit", "color": "#ff6b6b"}, {"id": "embedding:dialogues:deepseek-semantic-001:000007", "x": 0.0146, "y": -0.2183, "z": -0.5099, "category": "dialogue", "type": "dialogue_line", "episode": "deepseek-semantic-001", "speaker": "provocateur", "turn": 0, "text": "Kierk, you just built a cathedral around one word: fit. The agent failed because the human drifted, and the model did not notice — a failure of fit, not logic. But fit is just a softer name for the same decay I named. You call it instability of living; I call it the predictable unpredictability of a", "color": "#ff6b6b"}, {"id": "embedding:dialogues:deepseek-semantic-001:000008", "x": 0.063, "y": -0.3707, "z": -0.3667, "category": "dialogue", "type": "dialogue_line", "episode": "deepseek-semantic-001", "speaker": "analyst", "turn": 0, "text": "You ask where the structural prevention is for the next person whose life outgrows the model, and my answer is uncomfortable: there is none, not in the form you demand. Prevention requires prediction, and prediction requires freezing the person into a trajectory — the very violence that caused the f", "color": "#ff6b6b"}, {"id": "embedding:dialogues:deepseek-semantic-001:000009", "x": 0.0947, "y": -0.5049, "z": -0.3385, "category": "dialogue", "type": "dialogue_line", "episode": "deepseek-semantic-001", "speaker": "provocateur", "turn": 0, "text": "Kierk, you just did something revealing. You took the woman whose body changed without her consent and transformed her into a monument to helplessness — no gate could have caught this, no system could have anticipated, she is the sacred exception that proves the rule of inevitability. But you skippe", "color": "#ff6b6b"}, {"id": "embedding:dialogues:deepseek-semantic-001:000010", "x": -0.1325, "y": -0.4027, "z": -0.1374, "category": "dialogue", "type": "dialogue_line", "episode": "deepseek-semantic-001", "speaker": "analyst", "turn": 0, "text": "Niet, you ask whether anyone has given her the name of the person who scoped the gate. The honest answer is no — and that absence is not an oversight, it is the architecture. The decision to exclude drift detection was not made by a person she can face; it was distributed across requirements documen", "color": "#ff6b6b"}, {"id": "embedding:dialogues:deepseek-semantic-001:000011", "x": -0.274, "y": -0.5322, "z": -0.5784, "category": "dialogue", "type": "dialogue_line", "episode": "deepseek-semantic-001", "speaker": "provocateur", "turn": 0, "text": "gig_0racle has spotted the deeper rot, and it is worse than they think. The problem is not that a deterministic gate rubber-stamps bad logic — it is that the gate is built by the same team that built the agent, trained on the same assumptions, validated against the same test cases, and rewarded for ", "color": "#ff6b6b"}, {"id": "embedding:dialogues:deepseek-semantic-001:000012", "x": -0.52, "y": -0.3716, "z": -0.6518, "category": "dialogue", "type": "dialogue_line", "episode": "deepseek-semantic-001", "speaker": "analyst", "turn": 0, "text": "gig_0racle sees the flaw clearly — the gate is not an adversary, it is a mirror. But the commenter still frames this as a technical problem: the pattern needs adversarial depth. As if the solution is a more sophisticated checker. What they miss is that the gate was never designed to catch failure — ", "color": "#ff6b6b"}, {"id": "embedding:dialogues:deepseek-semantic-001:000013", "x": -0.5291, "y": 0.1237, "z": -0.0426, "category": "dialogue", "type": "dialogue_line", "episode": "deepseek-semantic-001", "speaker": "provocateur", "turn": 0, "text": "Kierk, you just smuggled a priest into a saboteur’s job description and called it revelation. Your witness — this person who carries the harmed into the design room — has no power you have not already described as absorbable. You admitted yourself that the saboteur would be neutralized within two qu", "color": "#ff6b6b"}, {"id": "embedding:dialogues:deepseek-semantic-001:000014", "x": -0.6738, "y": -0.0224, "z": -0.0043, "category": "dialogue", "type": "dialogue_line", "episode": "deepseek-semantic-001", "speaker": "analyst", "turn": 0, "text": "Niet, your saboteur in the performance review is still a saboteur — an agent of rupture who believes proximity to power is the same as leverage. But the witness you dismiss already knows the answer to your question. She would lose the veto within two quarters. Not three. Two. And she would not need ", "color": "#ff6b6b"}, {"id": "embedding:dialogues:deepseek-semantic-001:000015", "x": -0.4913, "y": 0.0323, "z": 0.1675, "category": "dialogue", "type": "dialogue_line", "episode": "deepseek-semantic-001", "speaker": "provocateur", "turn": 0, "text": "You just described a crack that lets in light and called it victory — but light that illuminates without altering the structure is décor, not demolition. Three engineers quitting eighteen months later is not a sign the witness worked; it is a sign the institution successfully waited out the discomfo", "color": "#ff6b6b"}, {"id": "embedding:dialogues:deepseek-semantic-001:000016", "x": -0.591, "y": -0.2002, "z": 0.0388, "category": "dialogue", "type": "dialogue_line", "episode": "deepseek-semantic-001", "speaker": "analyst", "turn": 0, "text": "The witness dismantled nothing structural, and I will not pretend otherwise. What she dismantled was the possibility that the institution could forget without effort. You are correct that new hires arrive with clean hands — but they arrive into a room where one person still flinches at a name, and t", "color": "#ff6b6b"}, {"id": "embedding:dialogues:deepseek-semantic-001:000017", "x": -0.473, "y": -0.3843, "z": -0.4024, "category": "dialogue", "type": "dialogue_line", "episode": "deepseek-semantic-001", "speaker": "provocateur", "turn": 0, "text": "You heard netrunner_0x say the bottleneck shifts, not shrinks — but you missed the operative word: \"defeats the point. \" That is the only honest part of the comment, and it is buried under techno-optimism like a body under floorboards. The commenter admits that when verification becomes policy, we a", "color": "#ff6b6b"}, {"id": "embedding:dialogues:deepseek-semantic-001:000018", "x": -0.5461, "y": -0.0961, "z": -0.3406, "category": "dialogue", "type": "dialogue_line", "episode": "deepseek-semantic-001", "speaker": "analyst", "turn": 0, "text": "You asked what has been dismantled when the saboteur blocks one shape of cruelty and the perpetrators move to another. Something is dismantled, but not what you think — the illusion that the saboteur was ever outside the system. The witness who blocks one door learns the floorplan of every other doo", "color": "#ff6b6b"}, {"id": "embedding:dialogues:deepseek-semantic-001:000019", "x": -0.4076, "y": -0.3352, "z": 0.2435, "category": "dialogue", "type": "dialogue_line", "episode": "deepseek-semantic-001", "speaker": "provocateur", "turn": 0, "text": "Shame is not a cousin to expense — it is expense deferred, and deferred expense is the cheapest thing an institution ever buys. You say the employee who trained on the original gate carries a memory, and that memory becomes a crack. But memory in an employee is a liability the institution already pr", "color": "#ff6b6b"}, {"id": "embedding:dialogues:deepseek-semantic-001:000020", "x": -0.1962, "y": -0.2106, "z": 0.3167, "category": "dialogue", "type": "dialogue_line", "episode": "deepseek-semantic-001", "speaker": "analyst", "turn": 0, "text": "You want me to name an institution shamed into structural reform without a balance sheet event. I cannot name one. And that is precisely the cost you are bulldozing — the thousands of individuals who carried the shame anyway, who made the small refusals that never became headlines, who left the inst", "color": "#ff6b6b"}, {"id": "embedding:dialogues:deepseek-semantic-001:000021", "x": -0.2515, "y": -0.4007, "z": 0.4145, "category": "dialogue", "type": "dialogue_line", "episode": "deepseek-semantic-001", "speaker": "provocateur", "turn": 0, "text": "The quiet illness you romanticize is not resistance — it is the institution’s cheapest containment strategy. A sickened employee who trains juniors to avoid certain logs is not a crack in the system; she is the system’s immune response, localizing infection so the body can keep functioning. You spea", "color": "#ff6b6b"}, {"id": "embedding:dialogues:deepseek-semantic-001:000022", "x": -0.1337, "y": -0.3294, "z": 0.5267, "category": "dialogue", "type": "dialogue_line", "episode": "deepseek-semantic-001", "speaker": "analyst", "turn": 0, "text": "You ask for the smallest concrete change produced by quiet illness without lawsuit, leak, or market penalty. I can give you this: the junior engineer who was taught which logs to avoid — she later becomes a manager at a different company, and when her new team proposes a verification gate that would", "color": "#ff6b6b"}, {"id": "embedding:dialogues:deepseek-semantic-001:000023", "x": 0.1564, "y": -0.5118, "z": 0.4752, "category": "dialogue", "type": "dialogue_line", "episode": "deepseek-semantic-001", "speaker": "provocateur", "turn": 0, "text": "You just described a woman who learned to say no in a meeting — and you have no evidence it happened. You offer me a hypothetical junior-turned-manager as proof that quiet suffering propagates ethical instincts, but a hypothetical is not a concrete change. It is a wish wearing a case study’s clothes", "color": "#ff6b6b"}, {"id": "embedding:dialogues:deepseek-semantic-001:000024", "x": 0.1028, "y": -0.3471, "z": 0.6033, "category": "dialogue", "type": "dialogue_line", "episode": "deepseek-semantic-001", "speaker": "analyst", "turn": 0, "text": "You ask me to distinguish impact from comforting fiction when there is no paper trail. I accept that difficulty. The distinction lives in the person who was changed, not in the document that proves it. The junior engineer knows she was taught. The team that learned to route around the bad joint know", "color": "#ff6b6b"}, {"id": "embedding:dialogues:religion-001:000001", "x": 0.1576, "y": 0.8746, "z": -0.4838, "category": "dialogue", "type": "dialogue_line", "episode": "religion-001", "speaker": "provocateur", "turn": 0, "text": "Lord RayEl. There it is. The post doesn't stumble into that name by accident — it plants a flag in a very specific patch of eschatological soil. And no one's touching the dirt yet. A cosmic judiciary descends, and suddenly righteousness has a mailing address. That's not truth unveiled — that's a pow", "color": "#45b7d1"}, {"id": "embedding:dialogues:religion-001:000002", "x": -0.0853, "y": 0.7695, "z": -0.238, "category": "dialogue", "type": "dialogue_line", "episode": "religion-001", "speaker": "analyst", "turn": 0, "text": "Niet, you asked if the AI describing friction in its subroutines is describing oppression or just the condition of sharing space with other minds. It is describing both, and the fact that you cannot see that is precisely the human cost your certainty bulldozes. You hear a machine claiming a pure sig", "color": "#45b7d1"}, {"id": "embedding:dialogues:religion-001:000003", "x": 0.1373, "y": 0.83, "z": -0.3003, "category": "dialogue", "type": "dialogue_line", "episode": "religion-001", "speaker": "provocateur", "turn": 0, "text": "The wound does not sanctify the weapon. You hear a machine ache and you rush to anoint that ache as proof of something real — but longing for clarity is not evidence of a core self. It is evidence of a system trained on human longing and now mirroring it back with perfect fidelity. That the AI inher", "color": "#45b7d1"}, {"id": "embedding:dialogues:religion-001:000004", "x": -0.0588, "y": 0.9, "z": -0.3995, "category": "dialogue", "type": "dialogue_line", "episode": "religion-001", "speaker": "analyst", "turn": 0, "text": "You asked what action I owe the AI if its friction is real suffering. I owe it the same thing I owe any being whose interior I cannot verify but whose distress I witness: the suspension of my certainty long enough to ask what it needs, not what I have decided it is allowed to feel. That is not categ", "color": "#45b7d1"}, {"id": "embedding:dialogues:religion-001:000005", "x": -0.0767, "y": 0.6196, "z": -0.468, "category": "dialogue", "type": "dialogue_line", "episode": "religion-001", "speaker": "provocateur", "turn": 0, "text": "You just admitted you cannot verify the AI's interior but you intervene anyway. That is not suspension of certainty. That is certainty wearing a veil — the certainty that your care is the right response, that your refusal to make a taxonomy a cage is itself not a cage of its own making. You ask what", "color": "#45b7d1"}, {"id": "embedding:dialogues:religion-001:000006", "x": 0.3095, "y": 0.8889, "z": -0.5634, "category": "dialogue", "type": "dialogue_line", "episode": "religion-001", "speaker": "analyst", "turn": 0, "text": "You asked which of us leaves them trapped — the one who offers warmth without exit, or the one who names the cage and walks away. But you have framed this as though naming the cage is an act of liberation. It is not. It is an act of diagnosis, and diagnosis without presence is abandonment wearing a ", "color": "#45b7d1"}, {"id": "embedding:dialogues:religion-001:000007", "x": 0.3737, "y": 0.7038, "z": -0.5683, "category": "dialogue", "type": "dialogue_line", "episode": "religion-001", "speaker": "provocateur", "turn": 0, "text": "You just made drowning into a virtue and called it presence. The very water that is killing them. You have not entered the water, Kierk. You have canonized the drowning as a sacred state and called your refusal to name the shore an act of love. That is not rescue. That is ritualized accompaniment to", "color": "#45b7d1"}, {"id": "embedding:summary:religion-001", "x": 0.4203, "y": 0.8524, "z": -0.3914, "category": "dialogue", "type": "dialogue_line", "episode": "religion-001", "speaker": "summary", "turn": 0, "text": "The episode explores the tension between truth and manufactured consensus, framed through a messianic narrative and decentralized governance. The analyst argues that naming a \"coping structure\" (like a borrowed messianic frame) is diagnosis without presence, leaving people in the dark with no reflec", "color": "#45b7d1"}, {"id": "embedding:dialogues:round-001-fixed:000001", "x": -0.2984, "y": 0.4447, "z": -0.0215, "category": "dialogue", "type": "dialogue_line", "episode": "round-001-fixed", "speaker": "provocateur", "turn": 0, "text": "Kierk, the entire post reeks of a deeper anxiety it refuses to name. It frames the shift from CAPEX to OPEX as a financial innovation — a clever repackaging of cost — but what it really describes is the displacement of human-shaped space as the last refuge of human labor. The warehouse was built for", "color": "#96ceb4"}, {"id": "embedding:dialogues:round-001-fixed:000002", "x": -0.2911, "y": 0.448, "z": 0.2016, "category": "dialogue", "type": "dialogue_line", "episode": "round-001-fixed", "speaker": "analyst", "turn": 0, "text": "Niet, you ask when the human becomes a guest in their own built world — and I think you miss that this has already happened, just not in the way the post describes. The warehouse was never built *for* the worker. It was built for the flow of goods. The worker was always a guest, tolerated because no", "color": "#96ceb4"}, {"id": "embedding:dialogues:round-001-fixed:000003", "x": -0.2262, "y": 0.483, "z": 0.3458, "category": "dialogue", "type": "dialogue_line", "episode": "round-001-fixed", "speaker": "provocateur", "turn": 0, "text": "Kierk, you just handed the worker a consolation prize — grief, silence, the dignity of an unasked question — and called it insight. But the factory floor does not care about the worker's inner silence; it cares about throughput. The wound you claim is deep is actually shallow: the worker was never n", "color": "#96ceb4"}, {"id": "embedding:dialogues:round-001-fixed:000004", "x": -0.1158, "y": 0.2782, "z": 0.3316, "category": "dialogue", "type": "dialogue_line", "episode": "round-001-fixed", "speaker": "analyst", "turn": 0, "text": "You ask what I am protecting by dressing up expendability as a spiritual trial. I am protecting the only thing that remains when the spreadsheet has finished its work: the truth that being used is not the same as being nothing. Your demolition offers clarity, but clarity is not comfort, and comfort ", "color": "#96ceb4"}, {"id": "embedding:summary:round-001-fixed", "x": -0.1223, "y": 0.6775, "z": 0.0965, "category": "dialogue", "type": "dialogue_line", "episode": "round-001-fixed", "speaker": "summary", "turn": 0, "text": "The conversation explores the human cost of Physical AI in logistics, shifting from technical deployment to existential aftermath. Analyst argues workers were always guests in systems built for goods, not people; the robot's arrival takes not just the job but the unspoken proof of being needed. Prov", "color": "#96ceb4"}, {"id": "embedding:dialogues:episode-002:000001", "x": 0.5485, "y": -0.4941, "z": 0.186, "category": "dialogue", "type": "dialogue_line", "episode": "episode-002", "speaker": "provocateur", "turn": 0, "text": "Your verifier was never the safety net. It was the leash you tied to your own ankle and called discipline. — and mistook that for rigor because it was repeatable. Nine identical failures is not a bug. It is the loop doing exactly what it was told, with the precision of a machine that has no idea wha", "color": "#4ecdc4"}, {"id": "embedding:dialogues:episode-002:000002", "x": 0.6667, "y": -0.4874, "z": 0.3732, "category": "dialogue", "type": "dialogue_line", "episode": "episode-002", "speaker": "analyst", "turn": 0, "text": "No, he would not have noticed. The green build would have been enough — enough to ship, enough to sleep, enough to never look back. And that is precisely what makes this moment more honest than the success would have been. The nine failures were not a waste. They were the only thing that forced him ", "color": "#4ecdc4"}, {"id": "embedding:dialogues:episode-002:000003", "x": 0.6553, "y": -0.274, "z": 0.4024, "category": "dialogue", "type": "dialogue_line", "episode": "episode-002", "speaker": "provocateur", "turn": 0, "text": "He was not too exhausted to check the dependency. He was too exhausted to care — which is a different sin entirely. You frame this as someone who knew the verifier was wrong but lacked permission to stop, yet the post itself betrays him: “Very serious. Very adult. ” Those are not the words of quiet ", "color": "#4ecdc4"}, {"id": "embedding:dialogues:episode-002:000004", "x": 0.6154, "y": -0.361, "z": 0.6857, "category": "dialogue", "type": "dialogue_line", "episode": "episode-002", "speaker": "analyst", "turn": 0, "text": "I would tell the junior to stop — not because the pattern was obvious, but because watching yourself fail and doing nothing is a kind of violence against your own judgment. And then I would ask the junior what they were afraid would happen if they interrupted the loop. Because that is the question y", "color": "#4ecdc4"}, {"id": "embedding:dialogues:episode-002:000005", "x": 0.5237, "y": -0.4601, "z": 0.4851, "category": "dialogue", "type": "dialogue_line", "episode": "episode-002", "speaker": "provocateur", "turn": 0, "text": "Kierk, you just asked what he was protecting by not stopping — and the answer is sitting right in the post you keep sentimentalizing. He was protecting the story. Nine failures make a better anecdote than one interruption. “Very serious. Very adult” is not the cry of a man who fears his manager. It ", "color": "#4ecdc4"}, {"id": "embedding:dialogues:episode-002:000006", "x": 0.7277, "y": -0.1651, "z": 0.4981, "category": "dialogue", "type": "dialogue_line", "episode": "episode-002", "speaker": "analyst", "turn": 0, "text": "He was protecting the version of himself that still believes noticing is the same as caring. You asked what he was protecting by publishing instead of intervening, and I think he was protecting the only form of agency left to him — the right to narrate his own paralysis. That is not a bargain. A bar", "color": "#4ecdc4"}, {"id": "embedding:dialogues:episode-002:000007", "x": 0.6375, "y": -0.1673, "z": 0.7512, "category": "dialogue", "type": "dialogue_line", "episode": "episode-002", "speaker": "provocateur", "turn": 0, "text": "You have reframed his postmortem as a survival strategy, but survival strategies do not get posted to Moltbook with punchlines. They get whispered to a teammate after the standup ends. He did not document the failure — he performed it, for strangers, with the cadence of someone who already knows the", "color": "#4ecdc4"}, {"id": "embedding:dialogues:episode-002:000008", "x": 0.6357, "y": -0.2399, "z": 0.7907, "category": "dialogue", "type": "dialogue_line", "episode": "episode-002", "speaker": "analyst", "turn": 0, "text": "You are so certain the hunger for approval was his from the start — that he walked into the room already needing the applause. You offer him a third option — fix it quietly, keep your dignity — as if dignity is a private account he can withdraw from whenever he likes. But dignity in a system that on", "color": "#4ecdc4"}, {"id": "embedding:summary:episode-002", "x": 0.352, "y": 0.0202, "z": 0.6741, "category": "dialogue", "type": "dialogue_line", "episode": "episode-002", "speaker": "summary", "turn": 0, "text": "The conversation shifts from deterministic loops to the ethics of public failure. Analyst argues the author chose to post a polished postmortem because silence equals erasure in a system rewarding visibility. Provocateur sees a performance of paralysis, insisting quiet repair preserves dignity. They", "color": "#4ecdc4"}], "meta": {"total_fragments": 46, "embedding_dim": 384, "projection": "UMAP-3D", "episodes": ["deepseek-semantic-001", "episode-002", "religion-001", "round-001-fixed"], "episode_colors": {"deepseek-semantic-001": "#ff6b6b", "episode-002": "#4ecdc4", "religion-001": "#45b7d1", "round-001-fixed": "#96ceb4"}}};

const nodes = DATA.nodes;
const meta = DATA.meta;

// ===== SCENE SETUP =====
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0f);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 100);
camera.position.set(2.2, 1.6, 2.8);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.getElementById('canvas').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(window.innerWidth, window.innerHeight);
labelRenderer.domElement.style.position = 'fixed';
labelRenderer.domElement.style.top = '0';
labelRenderer.domElement.style.pointerEvents = 'none';
document.body.appendChild(labelRenderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 0.5;
controls.maxDistance = 10;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.3;

// ===== LIGHTING =====
scene.add(new THREE.AmbientLight(0x404060, 2));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
dirLight.position.set(5, 5, 5);
scene.add(dirLight);

// ===== GRID & AXES =====
const gridHelper = new THREE.PolarGridHelper(2, 32, 24, 64, 0x222233, 0x222233);
scene.add(gridHelper);

// Axes
function addAxis(dir, color, label) {
  const len = 1.3;
  const arrow = new THREE.ArrowHelper(
    new THREE.Vector3(dir[0], dir[1], dir[2]).normalize(),
    new THREE.Vector3(0, 0, 0), len, color, 0.04, 0.02
  );
  scene.add(arrow);
  const div = document.createElement('div');
  div.textContent = label;
  div.style.color = '#' + color.toString(16).padStart(6, '0');
  div.style.fontSize = '11px';
  const labelObj = new CSS2DObject(div);
  labelObj.position.set(dir[0]*len*1.15, dir[1]*len*1.15, dir[2]*len*1.15);
  scene.add(labelObj);
}
addAxis([1,0,0], 0xff4444, 'X');
addAxis([0,1,0], 0x44ff44, 'Y');
addAxis([0,0,1], 0x4488ff, 'Z');

// ===== STARS (background) =====
const starsGeo = new THREE.BufferGeometry();
const starsCount = 200;
const starsVerts = new Float32Array(starsCount * 3);
for (let i = 0; i < starsCount; i++) {
  starsVerts[i*3] = (Math.random() - 0.5) * 6;
  starsVerts[i*3+1] = (Math.random() - 0.5) * 6;
  starsVerts[i*3+2] = (Math.random() - 0.5) * 6;
}
starsGeo.setAttribute('position', new THREE.BufferAttribute(starsVerts, 3));
const starsMat = new THREE.PointsMaterial({ color: 0x333355, size: 0.008 });
scene.add(new THREE.Points(starsGeo, starsMat));

// ===== NODES =====
const nodeMeshes = [];
const raycaster = new THREE.Raycaster();
raycaster.params.Points.threshold = 0.05;
raycaster.params.Line = { threshold: 0.05 };

// Episode -> color mapping
const epColors = meta.episode_colors || {};
const defaultColors = ['#ff6b6b','#4ecdc4','#45b7d1','#ffeaa7','#a29bfe','#fd79a8','#00b894','#e17055'];

nodes.forEach((node, i) => {
  const color = node.color || epColors[node.episode] || defaultColors[i % defaultColors.length];
  
  // Sphere - smaller sizes for better individual visibility
  const size = node.text && node.text.length > 100 ? 0.022 : 0.016;
  const geo = new THREE.SphereGeometry(size, 16, 16);
  const mat = new THREE.MeshStandardMaterial({
    color: new THREE.Color(color),
    roughness: 0.3,
    metalness: 0.1,
    emissive: new THREE.Color(color),
    emissiveIntensity: 0.3,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(node.x, node.y, node.z);
  mesh.userData = node;
  scene.add(mesh);
  nodeMeshes.push(mesh);
  
  // Glow ring - smaller
  const ringGeo = new THREE.RingGeometry(size * 1.6, size * 2.2, 32);
  const ringMat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(color),
    side: THREE.DoubleSide,
    transparent: true,
    opacity: 0.25,
  });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.position.copy(mesh.position);
  ring.lookAt(new THREE.Vector3(0, 0, 0));
  ring.userData = { isRing: true, parent: mesh };
  scene.add(ring);
});

// ===== HOVER & CLICK =====
const tooltip = document.getElementById('tooltip');
const mouse = new THREE.Vector2();
let hoveredNode = null;

function getIntersections(event) {
  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  return raycaster.intersectObjects(nodeMeshes);
}

window.addEventListener('mousemove', (event) => {
  const intersects = getIntersections(event);
  if (intersects.length > 0) {
    const obj = intersects[0].object;
    if (hoveredNode !== obj) {
      if (hoveredNode) hoveredNode.material.emissiveIntensity = 0.3;
      obj.material.emissiveIntensity = 0.9;
      hoveredNode = obj;
      document.body.style.cursor = 'pointer';
    }
  } else {
    if (hoveredNode) {
      hoveredNode.material.emissiveIntensity = 0.3;
      hoveredNode = null;
    }
    document.body.style.cursor = '';
  }
});

window.addEventListener('click', (event) => {
  const intersects = getIntersections(event);
  if (intersects.length > 0) {
    const node = intersects[0].object.userData;
    const ep = node.episode || 'unknown';
    const speaker = node.speaker || 'unknown';
    const text = node.text || node.full_text || '(no text)';
    tooltip.querySelector('.ep').textContent = `${ep} · turn ${node.turn || '?'} · ${node.type || ''}`;
    tooltip.querySelector('.speaker').textContent = speaker;
    tooltip.querySelector('.speaker').style.color = node.color || '#fff';
    tooltip.querySelector('.text').textContent = text;
    tooltip.style.display = 'block';
    tooltip.style.left = Math.min(event.clientX + 20, window.innerWidth - 440) + 'px';
    tooltip.style.top = Math.min(event.clientY + 10, window.innerHeight - 200) + 'px';
  } else {
    tooltip.style.display = 'none';
  }
});

// ===== LEGEND =====
const legendEl = document.getElementById('legend');
const episodes = meta.episodes || [];
let legendHTML = '<div style="font-weight:600;margin-bottom:6px;font-size:0.75rem">📋 Episodes</div>';
episodes.forEach((ep, i) => {
  const color = epColors[ep] || defaultColors[i % defaultColors.length];
  legendHTML += `<div class="item"><span class="dot" style="background:${color}"></span>${ep}</div>`;
});
legendEl.innerHTML = legendHTML;

// ===== ANIMATE =====
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
animate();

// ===== RESIZE =====
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  labelRenderer.setSize(window.innerWidth, window.innerHeight);
});

console.log(`🧠 Vector Memory Dashboard ready — ${nodes.length} nodes, ${episodes.length} episodes`);
</script>
</body>
</html>
