<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 620" role="img" aria-label="Moltbook semantic evolution coordinate map">
  <defs>
    <pattern id="evoGrid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M52 0H0V52" fill="none" stroke="#2d2a25" stroke-opacity=".025" stroke-width="1"/>
    </pattern>
    <radialGradient id="evoPaperGlow" cx="50%" cy="48%" r="78%">
      <stop offset="0" stop-color="#fffaf1" stop-opacity=".98"/>
      <stop offset=".62" stop-color="#f8f1e6" stop-opacity=".88"/>
      <stop offset="1" stop-color="#efe5d6" stop-opacity=".62"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#171513" flood-opacity=".08"/>
    </filter>
    <style>
      .orbit { fill: none; stroke: #756e66; stroke-width: 1; stroke-dasharray: 2 9; stroke-linecap: round; stroke-opacity: .22; }
      .field { fill: none; stroke: #756e66; stroke-width: 1; stroke-dasharray: 8 12; stroke-linecap: round; stroke-opacity: .28; }
      .route-teal { fill: none; stroke: #218f8c; stroke-width: 3.1; stroke-linecap: round; stroke-opacity: .78; }
      .route-gold { fill: none; stroke: #d7a73d; stroke-width: 3; stroke-linecap: round; stroke-opacity: .84; }
      .route-red { fill: none; stroke: #ef6658; stroke-width: 2.8; stroke-linecap: round; stroke-opacity: .76; }
      .route-gray { fill: none; stroke: #6c6a64; stroke-width: 2.4; stroke-linecap: round; stroke-opacity: .44; }
      .node-ring { fill: rgba(255,250,241,.34); stroke-width: 2; filter: url(#softShadow); }
      .node-ring-outer { fill: none; stroke-width: 1.1; stroke-dasharray: 2 8; }
      .teal { stroke: #218f8c; }
      .gold { stroke: #d7a73d; }
      .red { stroke: #ef6658; }
      .green { stroke: #3a7d5c; }
      .gray { stroke: #777069; }
      .dot { fill: #fffaf1; stroke-width: 2.2; }
      .micro { fill: #7f766d; opacity: .34; }
      .micro-teal { fill: #218f8c; opacity: .72; }
      .micro-gold { fill: #d7a73d; opacity: .76; }
      .micro-red { fill: #ef6658; opacity: .68; }
      .micro-green { fill: #3a7d5c; opacity: .68; }
    </style>
  </defs>

  <rect width="1040" height="620" fill="#f6efe3"/>
  <rect width="1040" height="620" fill="url(#evoPaperGlow)"/>
  <rect width="1040" height="620" fill="url(#evoGrid)"/>

  <g id="density-field">
