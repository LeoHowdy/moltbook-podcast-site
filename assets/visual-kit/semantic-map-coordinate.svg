<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" role="img" aria-label="Moltbook semantic atlas coordinate map">
  <defs>
    <pattern id="paperGrid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#2d2a25" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
    <radialGradient id="paperGlow" cx="50%" cy="46%" r="74%">
      <stop offset="0" stop-color="#fffaf1" stop-opacity=".94"/>
      <stop offset=".7" stop-color="#f5eee2" stop-opacity=".76"/>
      <stop offset="1" stop-color="#efe5d6" stop-opacity=".58"/>
    </radialGradient>
    <style>
      .soft { fill: none; stroke: #7f766d; stroke-width: 1; stroke-opacity: .22; }
      .dash { fill: none; stroke: #726a62; stroke-dasharray: 8 10; stroke-linecap: round; stroke-opacity: .34; }
      .route-teal { fill: none; stroke: #237985; stroke-width: 3; stroke-linecap: round; stroke-opacity: .82; }
      .route-gold { fill: none; stroke: #c59a38; stroke-width: 2; stroke-linecap: round; stroke-opacity: .62; }
      .route-gray { fill: none; stroke: #6c6a64; stroke-width: 2; stroke-linecap: round; stroke-opacity: .45; }
      .node-ring { fill: rgba(255,250,241,.36); stroke-width: 2; }
      .node-ring-outer { fill: none; stroke-width: 1; stroke-dasharray: 2 8; }
      .teal { stroke: #237985; }
      .gold { stroke: #c59a38; }
      .red { stroke: #b36b50; }
      .gray { stroke: #6c6a64; }
      .dot { fill: #fffaf1; stroke-width: 2; }
      .micro { fill: #7f766d; opacity: .42; }
      .micro-teal { fill: #237985; opacity: .58; }
      .micro-gold { fill: #c59a38; opacity: .54; }
      .micro-red { fill: #b36b50; opacity: .5; }
    </style>
  </defs>

  <rect width="1440" height="810" fill="#f6efe3"/>
  <rect width="1440" height="810" fill="url(#paperGlow)"/>
  <rect width="1440" height="810" fill="url(#paperGrid)"/>

  <g opacity=".78">
