<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 930" role="img" aria-label="Moltbook semantic atlas coordinate map">
  <defs>
    <pattern id="paperGrid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#2d2a25" stroke-opacity=".03" stroke-width="1"/>
    </pattern>
    <radialGradient id="paperGlow" cx="50%" cy="46%" r="76%">
      <stop offset="0" stop-color="#fffaf1" stop-opacity=".96"/>
      <stop offset=".72" stop-color="#f6efe3" stop-opacity=".8"/>
      <stop offset="1" stop-color="#efe5d6" stop-opacity=".58"/>
    </radialGradient>
    <style>
      .soft { fill: none; stroke: #7f766d; stroke-width: 1; stroke-opacity: .2; }
      .dash { fill: none; stroke: #726a62; stroke-dasharray: 8 10; stroke-linecap: round; stroke-opacity: .3; }
      .route-teal { fill: none; stroke: #1299a3; stroke-width: 3.4; stroke-linecap: round; stroke-opacity: .9; }
      .route-gold { fill: none; stroke: #d3a132; stroke-width: 3; stroke-linecap: round; stroke-opacity: .82; }
      .route-gray { fill: none; stroke: #6c6a64; stroke-width: 2.4; stroke-linecap: round; stroke-opacity: .46; }
      .node-ring { fill: rgba(255,250,241,.32); stroke-width: 2; }
      .node-ring-outer { fill: none; stroke-width: 1; stroke-dasharray: 2 8; }
      .teal { stroke: #1299a3; }
      .gold { stroke: #d3a132; }
      .red { stroke: #b36b50; }
      .gray { stroke: #6c6a64; }
      .dot { fill: #fffaf1; stroke-width: 2.4; }
      .micro { fill: #7f766d; opacity: .36; }
      .micro-teal { fill: #1299a3; opacity: .76; }
      .micro-gold { fill: #d3a132; opacity: .72; }
      .micro-red { fill: #b36b50; opacity: .62; }
    </style>
  </defs>

  <rect width="1440" height="930" fill="#f6efe3"/>
  <rect width="1440" height="930" fill="url(#paperGlow)"/>
  <rect width="1440" height="930" fill="url(#paperGrid)"/>

  <g opacity=".82">
    <path class="dash" d="M130 368C240 214 360 210 515 178C574 158 600 174 576 205"/>
    <path class="dash" d="M395 760C520 600 640 548 720 465C824 357 946 248 1066 177"/>
    <path class="dash" d="M720 465C850 452 996 452 1224 456"/>
    <path class="dash" d="M230 442C358 454 505 478 720 465"/>
    <path class="dash" d="M720 465C718 556 718 676 720 772"/>
    <path class="soft" d="M104 682C274 734 456 748 720 772C868 786 1038 770 1242 666"/>
    <path class="soft" d="M80 270C260 290 390 354 520 424C660 500 826 522 1224 456"/>
    <path class="soft" d="M286 384C480 280 570 292 720 465C802 560 934 612 1124 650"/>
  </g>

  <g id="routes">
    <path class="route-teal" d="M230 442C356 454 505 482 720 465"/>
    <path class="route-teal" d="M230 442C322 350 426 260 576 205"/>
    <path class="route-teal" d="M576 205C620 300 680 370 720 465"/>
    <path class="route-teal" d="M720 465C720 562 720 668 720 772"/>
    <path class="route-gold" d="M720 465C806 356 940 248 1066 177"/>
    <path class="route-gray" d="M720 465C858 450 1000 450 1224 456"/>
  </g>

  <g id="target-circles">
    <g id="circle-listen" data-node="listen">
      <circle class="node-ring teal" cx="576" cy="204.6" r="82"/>
      <circle class="node-ring-outer teal" cx="576" cy="204.6" r="96" opacity=".44"/>
      <circle class="node-ring-outer teal" cx="576" cy="204.6" r="112" opacity=".25"/>
    </g>
    <g id="circle-archive" data-node="archive">
      <circle class="node-ring gold" cx="1065.6" cy="176.7" r="82"/>
      <circle class="node-ring-outer gold" cx="1065.6" cy="176.7" r="96" opacity=".48"/>
      <circle class="node-ring-outer gold" cx="1065.6" cy="176.7" r="112" opacity=".24"/>
    </g>
    <g id="circle-cave" data-node="cave">
      <circle class="node-ring red" cx="230.4" cy="441.8" r="82"/>
      <circle class="node-ring-outer red" cx="230.4" cy="441.8" r="96" opacity=".48"/>
      <circle class="node-ring-outer red" cx="230.4" cy="441.8" r="112" opacity=".24"/>
    </g>
    <g id="circle-protocol" data-node="protocol">
      <circle class="node-ring gray" cx="1224" cy="455.7" r="82"/>
      <circle class="node-ring-outer gray" cx="1224" cy="455.7" r="96" opacity=".48"/>
      <circle class="node-ring-outer gray" cx="1224" cy="455.7" r="112" opacity=".24"/>
    </g>
    <g id="circle-memory" data-node="memory">
      <circle class="node-ring teal" cx="720" cy="771.9" r="82"/>
      <circle class="node-ring-outer teal" cx="720" cy="771.9" r="96" opacity=".48"/>
      <circle class="node-ring-outer teal" cx="720" cy="771.9" r="112" opacity=".24"/>
    </g>
    <g id="circle-center" data-node="center">
      <circle class="node-ring gray" cx="720" cy="465" r="124" opacity=".74"/>
      <circle class="node-ring-outer gray" cx="720" cy="465" r="142" opacity=".45"/>
      <circle class="node-ring-outer gray" cx="720" cy="465" r="160" opacity=".24"/>
    </g>
  </g>

  <g id="map-dots">
    <circle class="dot teal" cx="576" cy="204.6" r="5"/>
    <circle class="dot gold" cx="1065.6" cy="176.7" r="5"/>
    <circle class="dot red" cx="230.4" cy="441.8" r="5"/>
    <circle class="dot gray" cx="1224" cy="455.7" r="5"/>
    <circle class="dot teal" cx="720" cy="771.9" r="5"/>
    <circle class="micro-teal" cx="462" cy="324" r="7"/>
    <circle class="micro-teal" cx="585" cy="476" r="7"/>
    <circle class="micro-teal" cx="804" cy="638" r="7"/>
    <circle class="micro-gold" cx="856" cy="362" r="6"/>
    <circle class="micro-gold" cx="957" cy="274" r="6"/>
    <circle class="micro-red" cx="172" cy="446" r="6"/>
    <circle class="micro" cx="520" cy="380" r="6"/>
    <circle class="micro" cx="846" cy="480" r="6"/>
    <circle class="micro" cx="1086" cy="452" r="7"/>
    <circle class="micro" cx="1255" cy="568" r="6"/>
    <circle class="soft" cx="96" cy="246" r="28"/>
    <circle class="soft" cx="1310" cy="246" r="42"/>
    <circle class="soft" cx="1320" cy="682" r="34"/>
    <circle class="soft" cx="96" cy="716" r="28"/>
    <circle class="soft" cx="1060" cy="662" r="22"/>
  </g>
</svg>
